name: Verify archived article evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Essential adversarial tests
        run: python -B -m unittest discover -s code/tests -v
      - name: Archived records, summaries, displayed tables and complete file inventory
        run: python -B code/scripts/verify_evidence.py --output "$RUNNER_TEMP/verification.json"
      - name: Explicit new plotting dependencies, separate from historical R
        run: python -m pip install -r code/requirements-figures.txt
      - name: Reconstruct descriptive plots and table views
        run: python -B code/scripts/render_outputs.py --output "$RUNNER_TEMP/ivqr-views"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: archived-verification-and-reconstructed-views
          path: |
            ${{ runner.temp }}/verification.json
            ${{ runner.temp }}/ivqr-views
          if-no-files-found: warn
